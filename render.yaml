services:
  - type: web
    name: atlas-rag-pipeline
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RAG_DATA_DIR
        value: /tmp/atlas-rag-data
      - key: RAG_LLM_PROVIDER
        value: extractive

